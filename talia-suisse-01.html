/* THE BOOK IS WHITE. Her ruling, 2026-09-02: "change the back... black the black background and
   make it white." She asked why it was black THREE TIMES before this — 2026-09-01 08:48,
   2026-09-02 07:58, and again here — and each earlier time it was explained rather than fixed:
   the page followed the device theme, her tablet is in dark mode, C14 working as designed. An
   answer she has to ask for three times is a wrong answer.
   SO THIS BOOK NO LONGER FOLLOWS THE DEVICE. It is a book: paper is pale and ink is dark, the
   way a book is, whatever the tablet is set to. That is a DELIBERATE narrowing of C14 for this
   book — every colour is still a token and nothing is left to the user agent, but there is no
   dark palette to switch to.
   color-scheme:light is what stops the BROWSER from darkening what it draws for us — form
   controls, scrollbars and the flash of background before the first paint. Without it the page
   can still arrive black for a moment on a device in dark mode, which is exactly what she saw. */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#2A2118; --soft:#6B5D4A;
  --card:#FFFFFF; --line:#E4D9C4;
  --fr:#1D5C8F; --en:#2F6B45;

  --shadow:0 2px 0 rgba(42,33,24,.10);
}
/* THE DARK PALETTE IS GONE, NOT OVERRIDDEN. It was two blocks here — a prefers-color-scheme
   query and a data-theme="dark" block — and either one would have put the black background back
   the moment her tablet asked for it. Leaving them in and hoping the light one wins is how a
   colour rule gets reversed by a device setting. There is no dark palette in this book. */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--paper); color:var(--ink);
  font-family:"Baloo 2","Nunito","Quicksand",system-ui,-apple-system,"Trebuchet MS",sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;}
#page{position:fixed; inset:0; padding:max(14px,env(safe-area-inset-top)) 18px
  calc(84px + env(safe-area-inset-bottom)); overflow:hidden}
/* C1/P3 — 32px floor. The story, the English inside it and the French inside that all read at
   the same size, because they are all the same page of the same book. */
p.l{font-size:32px; line-height:1.75; margin:0 0 14px; color:var(--ink)}
/* THE PICTURE, AT A HEIGHT THAT DOES NOT DEPEND ON THE IMAGE LOADING. This is height, not
   max-height, and that is the whole point. With max-height the frame is as tall as its picture,
   and AT PAGINATION TIME THE PICTURE HAS NOT LOADED YET: an <img> with no intrinsic size measures
   about 18px, so every screen was measured 260px short and then grew when the file arrived.
   Measured before the fix, at 810x1080: ALL 39 screens ran past the fold, the worst by 262px —
   her last two lines pushed under the nav bar on every screen in the chapter, which is C6 broken
   everywhere by a picture that was supposed to be an improvement.
   A fixed height in vh is known before any file loads, so pagination and the rendered screen
   agree. It also means a tall drawing and a wide one cost the same known space, which is what
   keeps the text — the actual chapter — from being squeezed by whichever picture turns up. */
.art{height:min(30vh,260px); background:#FBF5E9; border:1px solid var(--line); border-radius:14px;
  padding:8px; margin:0 0 14px; display:flex; align-items:center; justify-content:center}
.art img{max-width:100%; max-height:100%; display:block}
.en{color:var(--en)}
.fr{color:var(--fr)}
/* B0/A3 — a part with no recording is MARKED and says so when tapped. Never silently silent. */
.nc{border-bottom:3px dotted var(--warn-line)}
.w{position:relative; display:inline-block; border-radius:9px; padding:0 .05em; cursor:pointer}
.w::after{content:""; position:absolute; left:-.10em; right:-.10em; top:-.16em; bottom:-.16em}
/* D — the highlight is the BACKGROUND plus a ring. Never a size or weight change: that reflows
   the line and she loses her place. The ring carries the contrast in both themes. */
.w.say-now{background:var(--mark); color:var(--mark-ink); box-shadow:0 0 0 2px var(--mark-line)}
.w.tapped{background:var(--mark); opacity:.55}
nav{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--card);

  display:flex; gap:10px; align-items:center}
nav button{min-height:56px; min-width:78px; border-radius:16px; border:2px solid transparent;

nav .ghost{background:transparent; color:var(--ghost-ink); border-color:var(--ghost-ink)}
nav button[disabled]{opacity:.4; cursor:default}
nav .grow{flex:1}
.pos{font-size:20px; color:var(--soft)}
.missing{position:fixed; left:50%; transform:translateX(-50%); bottom:104px; border-radius:16px;

function play(src, spans, words, endMs){

  return new Promise(res=>{

       roughly a second; the sidecar already knows where the words end, so nothing is cut and no
       approval is spent (A31-i) — only the WAIT ends early. The 150 ms tail lets a final
       consonant decay out, which is A25's concern. Driven by the element's own timeupdate, not

         « Sept jours » is one span and two words. The old loop did spans[k] for words[k], so on

         2026-09-02: 13 French parts had fewer spans than words — 2 of them, lines 35 and 218,
         with the group NOT last, so the whole tail of the sentence disagreed with the sound.
         That is the exact opposite of what a highlight is for: it tells her eye that the wrong
         word is the one being spoken, on the two lines where the French is longest.

         so word k belongs to the span that word k falls inside. No offset is invented; if the
         counts do not add up the extra words simply light nothing, which is what the old code
         did anyway and is honest. */
      const W2S=[];

        if(mine!==token){ cancelAnimationFrame(raf); return; }
        const ms=a.currentTime*1000+50;   /* the eye must arrive BEFORE the sound */
        clearMark();

        }
        raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
    }
    a.play().catch(()=>{ announce('Tap the screen once, then it can speak.'); done(); });

/* THE FRENCH IS CUT INTO ITS TAP UNITS, NOT INTO WHITESPACE-SEPARATED WORDS.
   A26-i: a bound group is ONE unit and ONE target, because splitting it changes the sound —
   « les œufs » is lay-ZEU and the /z/ belongs to neither word. Splitting French on spaces would
   have offered her « les » and « œufs » separately, which is the exact fault the bound-group
   rule exists to prevent. The units are computed in the build against the bank (longest group
   first) and passed through; the page never re-derives them.
   AND PUNCTUATION IS NOT A WORD. A lone dash or ellipsis was becoming a tap target that
   announced '"" has no recording of its own yet.' — a message about nothing, which is worse
   than no message. Only a token with a letter or a digit in it is a word. */
function wordSpans(text, kind, units){
  const f=document.createDocumentFragment();
  const toks = (kind==='fr' && units && units.length)
    ? units.flatMap((u,i)=>i?[' ',u]:[u])
    : String(text).split(/(\s+)/);
  toks.forEach(tok=>{
    if(!tok) return;
    if(/^\s+$/.test(tok)){ f.appendChild(document.createTextNode(tok)); return; }
    if(!/[\p{L}\p{N}]/u.test(tok)){ f.appendChild(document.createTextNode(tok)); return; }
    const s=document.createElement('span'); s.className='w'; s.textContent=tok;
    /* HOW MANY SIDECAR WORDS THIS SPAN COVERS. One, unless it is a bound group — « Sept jours »
       is one tap target and two spoken words. The highlight loop reads this to map word k to the
       span it is actually inside, instead of assuming the two lists line up. */
    s.dataset.words = String(tok.trim().split(/\s+/).filter(x=>/[\p{L}\p{N}]/u.test(x)).length || 1);
    s.onclick=async e=>{
      e.stopPropagation();
      /* A tapped word plays ITS OWN clip — French from the French bank, English from the
         English bank — or says it has none. Never a slice out of the sentence. */
      const u = kind==='fr' ? U(tok) : EU(tok);
      s.classList.add('tapped'); setTimeout(()=>s.classList.remove('tapped'),500);
      if(u) await play(u.mp3,null,null,u.end);
      else announce('"'+fold(tok)+'" has no recording of its own yet.');
    };
    f.appendChild(s);
  });
  return f;
}

    span.className = seg.k==='fr' ? 'fr' : seg.k==='en' ? 'en' : '';
    if(!C(seg.id)) span.classList.add('nc');
    if(seg.k==='en') span.appendChild(document.createTextNode('\u201c'));
    /* NO-BREAK SPACE INSIDE THE GUILLEMETS. French typography puts a space before » and after «,
       and it must be a NON-BREAKING one — with an ordinary space the closing » wrapped onto a line
       of its own, which is how « Bonjour Talia. » came out with a stray » under it. Correct French
       and a fixed orphan in the same character. */
    if(seg.k==='fr') span.appendChild(document.createTextNode('« '));
    span.appendChild(wordSpans(seg.text, seg.k==='fr'?'fr':'en', seg.units));
    if(seg.k==='en') span.appendChild(document.createTextNode('\u201d'));
    if(seg.k==='fr') span.appendChild(document.createTextNode(' »'));
    span._seg=seg;
    p.appendChild(span);
    if(i<l.segs.length-1) p.appendChild(document.createTextNode(' '));
  });
  p.onclick=()=>sayLine(p);
  return p;
}
/* B2 — ENGLISH IS SPOKEN FIRST, ALWAYS. Her line already puts the English before the French, so
   reading her parts in her own order IS the rule. If a French part has no English before it in
   the line, the English that belongs to it is the narration or quote it follows. */
async function sayLine(p){
  for(const span of [...p.children]){
    const seg=span._seg; if(!seg) continue;
    const c=C(seg.id);
    if(!c){ announce('"'+seg.text.slice(0,44)+'" has no recording yet.'); continue; }
    await play(c.mp3, [...span.querySelectorAll('.w')], c.words);
    await new Promise(r=>setTimeout(r,seg.k==='en'?520:240));
  }
}

/* ===================== screens, measured on the device =================
   C6 at level 1 — one screen, and NOTHING SCROLLS. The screens are not decided in the build:
   the page fills the real space on the real device, line by line, and starts a new screen when
   the next line would not fit. On a small phone that makes more screens; on her tablet fewer.
   Her SCENE BREAKS always start a new screen, because they are hers. */
let screens=[], at=0;
function paginate(){
  pageEl.innerHTML=''; screens=[];
  const probe=document.createElement('div'); pageEl.appendChild(probe);
  /* THE ROOM IS THE CONTENT BOX, NOT THE PADDING BOX. clientHeight INCLUDES the padding that
     is reserved for the nav bar, so measuring against it let the last line of every screen run
     underneath the buttons — the bottom of her sentence simply gone. Measured, not guessed:
     1080 tall, 14 top and 84 bottom of padding, so 982 is the space a line can actually use.
     And if the page is measured before it has a size — which happens if pagination runs during
     a navigation — every line looks too tall and the chapter comes out one line per screen.
     That is what "1 / 454" was. It waits and measures again instead. */
  const cs=getComputedStyle(pageEl);
  const room=pageEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(room<200){ probe.remove(); setTimeout(paginate,150); return; }
  /* THE PICTURE IS MEASURED, NOT ADDED AFTERWARDS. A picture drawn in show() but not present in
     the probe is height the pagination never counted, so the last line or two of every screen
     would sit under the fold — invisible, unspoken-to, and exactly the C6 breach that measuring
     the padding box was introduced to stop. Every screen therefore starts with its own art in
     the probe, and a screen with no picture measures as it always did. */
  const startScreen=l=>{ probe.innerHTML=''; const a=artEl(l); if(a) probe.appendChild(a); };
  let cur=[], scene=DATA.lines.length?DATA.lines[0].scene:1;
  if(DATA.lines.length) startScreen(DATA.lines[0]);
  for(const l of DATA.lines){
    /* HER SCENE BREAK ALSO HAD TO CLEAR THE PROBE. It pushed the screen and emptied cur but
       left every measured line in the probe, so from the first *** onwards the probe was always
       already over room and each following screen broke after a line or two. Found by counting
       screens per scene in the running page, not by reading this loop. */
    if(l.scene!==scene && cur.length){ screens.push(cur); cur=[]; startScreen(l); }
    scene=l.scene;
    const el=lineEl(l); probe.appendChild(el);
    if(probe.scrollHeight>room && cur.length){
      probe.removeChild(el);
      screens.push(cur); cur=[];
      startScreen(l);
      probe.appendChild(lineEl(l));
    }
    cur.push(l);
  }
  if(cur.length) screens.push(cur);
  pageEl.innerHTML='';
  show(Math.min(at,screens.length-1));
}
/* THE PICTURE FOR A SCREEN IS THE PICTURE OF ITS FIRST LINE. It is carried forward from the last
   line that named one, so a picture stays for as long as the story stays in that place and
   changes the moment her words move somewhere else.
   ARTWORK DOES NOT INVERT (manuscript rule 9). The drawings are line art on TRANSPARENT, made for
   cream paper — on a dark ground the whole picture reads as a black box. That rule does not bite
   on this page any more, because she ruled the book white on 2026-09-02 and there is no dark
   palette left to switch to. It is honoured anyway: the frame paints its own explicit ground
   rather than inheriting one, so the picture cannot go black if this book is ever themed again. */
/* ===== G0 RUNG 0 — THE PICTURES THAT ARE GEOMETRY =========================================
   Her ruling, 2026-08-30 11:28, in two words: "G0 prevails". Rung 0 of the ladder is CAN IT BE
   DRAWN IN CODE, and it comes BEFORE the library — a classroom seen from the back and a
   playground are geometry, so the ladder never descends past rung 0 for them. Free, sharp at any
   size, themed by the page, and no credit is spent, which matters while her hold on spending
   stands.
   THESE TWO WERE ALREADY WRITTEN AND WERE REACHABLE BY NOTHING. They lived in
   tools/ch1-template.js, which belongs to the old build-ch1.js pipeline that no longer writes
   builds/ch1.html — correct code, drawn, reviewed, and unreachable, while the school day sat with
   160 consecutive lines that had nothing to look at. Ported here by french-app-b4 2026-09-03; the
   originals stay where they are.
   NOTHING HERE IS A PERSON. Claude never draws people, animals, faces or scenes with characters
   in them — a standing prohibition after three failures. Rooms and objects only.
   THE INK IS A FIXED COLOUR, NOT --ink, because these sit on the same cream art ground the
   drawings use. A themed ink would go pale and vanish on its own paper. */
const S_INK='#2A2118', S_LINE='#8A7C68', S_BLUE='#1D5C8F', S_GREEN='#3B7A4B', S_RED='#C0392B';
function sceneSvg(body){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 400 240');
  s.setAttribute('preserveAspectRatio','xMidYMid meet');
  s.style.width='100%'; s.style.height='100%'; s.style.display='block';
  s.innerHTML=body; return s;
}
const SCENES={
  /* The classroom from the back: pegs with bags on the left, two tables, and the window. */
  classe: () => sceneSvg(
    '<rect x="0" y="188" width="400" height="52" fill="none" stroke="'+S_LINE+'" stroke-width="2"/>'+
    '<rect x="250" y="30" width="120" height="90" fill="none" stroke="'+S_INK+'" stroke-width="4" rx="4"/>'+
    '<path d="M310 30 V120 M250 75 H370" stroke="'+S_INK+'" stroke-width="3"/>'+
    '<path d="M20 40 H120" stroke="'+S_INK+'" stroke-width="4"/>'+
    '<path d="M35 40 v10 M65 40 v10 M95 40 v10" stroke="'+S_INK+'" stroke-width="4"/>'+
    '<rect x="24" y="50" width="22" height="28" rx="5" fill="'+S_BLUE+'" opacity=".75"/>'+
    '<rect x="54" y="50" width="22" height="28" rx="5" fill="'+S_GREEN+'" opacity=".75"/>'+
    '<rect x="84" y="50" width="22" height="28" rx="5" fill="'+S_RED+'" opacity=".6"/>'+
    '<rect x="40" y="130" width="140" height="14" rx="4" fill="none" stroke="'+S_INK+'" stroke-width="4"/>'+
    '<path d="M52 144 v44 M168 144 v44" stroke="'+S_INK+'" stroke-width="4"/>'+
    '<rect x="215" y="140" width="140" height="14" rx="4" fill="none" stroke="'+S_INK+'" stroke-width="4"/>'+
    '<path d="M227 154 v34 M343 154 v34" stroke="'+S_INK+'" stroke-width="4"/>'),
  /* The playground: a climbing frame, a ball, and painted lines on the ground.
     THE BALL'S SEAMS RUN DOWNWARDS ON PURPOSE. It was r=14 with two HORIZONTAL seams, and at the
     size this is actually displayed they closed into a single bar across a red circle — a NO
     ENTRY sign, on the one spread that is about wanting to keep playing. The markup was correct
     and only ever wrong at display size, which is why reading it would never have found it. Fix
     by french-app-10, carried across with the scene: r=22, seams top to bottom, because a
     vertical curve cannot collapse into a horizontal bar however small it gets. */
  cour: () => sceneSvg(
    '<path d="M0 190 H400" stroke="'+S_LINE+'" stroke-width="3"/>'+
    '<path d="M60 190 L120 70 L180 190" fill="none" stroke="'+S_INK+'" stroke-width="5"/>'+
    '<path d="M84 142 H156 M72 166 H168" stroke="'+S_INK+'" stroke-width="4"/>'+
    '<path d="M230 96 h90 v10 M230 96 v94 M320 106 v14" stroke="'+S_INK+'" stroke-width="5" fill="none"/>'+
    '<path d="M320 120 v40" stroke="'+S_INK+'" stroke-width="3"/>'+
    '<rect x="308" y="160" width="26" height="8" rx="4" fill="'+S_BLUE+'"/>'+
    '<circle cx="205" cy="168" r="22" fill="none" stroke="'+S_RED+'" stroke-width="5"/>'+
    '<path d="M205 146 q-15 22 0 44 M205 146 q15 22 0 44" fill="none" stroke="'+S_RED+'" stroke-width="3"/>'+
    '<path d="M20 210 h60 M100 210 h60 M180 210 h60 M260 210 h60" stroke="'+S_GREEN+'" stroke-width="5" stroke-linecap="round"/>'),
};
/* ===================== THE SEVEN-DAY CALENDAR, DRAWN IN CODE =====================
   HER INSTRUCTION, 2026-09-03: "The calendar should be built by the code because it's a straight
   geometric drawing, and it will be interactive whereby she will put a cross every day, a red
   cross every day on the day that has finished before she goes to bed."

   THIS IS RUNG 0 OF G0 AND THE REASON THE LADDER STARTS THERE. A calendar is squares and text.
   Drawn in code it costs nothing, it is sharp at any size, and — the part no picture can ever
   do — SHE CAN PRESS IT. A drawing of a calendar would have needed her to imagine the crossing
   off; this one lets her do it.

   IT FOLLOWS HER TEXT EXACTLY, and her text presses Monday TWICE:
     line 119, at breakfast   "Talia presses Monday on the calendar. A little mark appears
                               beside it. This is Day One."     -> a small mark BESIDE the day
     line 382, after dinner   "She presses Monday again. The first day is complete."
                                                                -> THE RED CROSS
   So the morning press is a mark and the evening press is the cross, because that is what she
   wrote. One calendar, two moments, the same geometry — the week she crossed off and the week
   she is looking at cannot drift apart.

   EVERY DAY SPEAKS, ENGLISH FIRST (B2). Fourteen labels she cannot read would be decoration
   (B0), which is what the old calendar was until the days were given their voices. Measured
   before building: all seven days exist in BOTH banks, so nothing here is silent and nothing
   was recorded for it. A day whose clip is missing SAYS SO (A3) — it never fails quietly.

   NOTHING CAN GO WRONG HERE. There is no wrong day to press, no failure state and no score.
   Pressing a day that is not today simply says that day's name, which is a word she just heard
   again rather than a mistake. */
const CAL={ marked:false, crossed:false };
const DOW=[['Monday','lundi'],['Tuesday','mardi'],['Wednesday','mercredi'],['Thursday','jeudi'],
           ['Friday','vendredi'],['Saturday','samedi'],['Sunday','dimanche']];
/* English, a beat, then French — the same order and the same pause the story lines use, because
   this is the story continuing and not a different kind of screen. */
async function sayDay(en,fr){
  const e=EU(en), f=U(fr);
  if(e) await play(e.mp3,null,null,e.end); else announce('"'+en+'" has no recording yet.');
  await new Promise(r=>setTimeout(r,520));
  if(f) await play(f.mp3,null,null,f.end); else announce('« '+fr+' » has no recording of its own yet.');
}
function calendarScene(evening){
  /* ITS OWN VIEWBOX, WIDER AND SHORTER THAN THE OTHER SCENES, AND THAT IS THE WHOLE FIX.
     Built first at the rooms' 400x240 with 52-wide cells and the French set at 21px, and the
     result was a smear: "lundimardiercrejeudiendreamdimanche" — mercredi is eight characters and
     needs about 70 units at that size, so six of the seven names ran straight through their
     neighbours. Unreadable, and invisible to every check in the project, because a gate counts
     pictures and cannot see that one is illegible. Found by looking at it.
     THE ALTERNATIVE WAS ABBREVIATIONS — lun, mar, mer — which is what a French wall calendar
     really prints and what the old build used. Rejected: "lun" is not a word she is learning and
     a fragment on screen teaches a fragment. The word she meets should be the word. So the
     calendar got wider instead of the French getting shorter. */
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{ const n=document.createElementNS(NS,t); for(const k in a) n.setAttribute(k,a[k]); return n; };
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 540 200');
  s.setAttribute('preserveAspectRatio','xMidYMid meet');
  s.style.width='100%'; s.style.height='100%'; s.style.display='block';
  const W=70, GAP=5, X0=10, Y=34, H=132;
  DOW.forEach((d,i)=>{
    const x=X0+i*(W+GAP), today=(i===0);
    const g=mk('g',{ style:'cursor:pointer' });
    /* THE WHOLE CELL IS THE TAP TARGET, not the text inside it. A six-year-old aims at the box. */
    g.appendChild(mk('rect',{ x:x, y:Y, width:W, height:H, rx:9,
      fill:'#FFFFFF', stroke:(today?S_BLUE:S_LINE), 'stroke-width':(today?4:2) }));
    /* ENGLISH ABOVE, FRENCH BELOW AND BIGGER — the same order her whole book uses (B2), so the
       calendar reads the way every other line of the chapter reads. textLength with
       lengthAdjust pins the longest names inside their cell no matter what font the device
       substitutes: measured on a laptop is not measured on her tablet, and "mercredi" running
       into "jeudi" is exactly the fault this is here to stop. */
    const en=mk('text',{ x:x+W/2, y:Y+30, 'text-anchor':'middle', 'font-size':13,
      fill:S_LINE, 'font-family':'inherit', textLength:W-12, lengthAdjust:'spacingAndGlyphs' });
    en.textContent=d[0];
    const fr=mk('text',{ x:x+W/2, y:Y+78, 'text-anchor':'middle', 'font-size':19,
      'font-weight':'800', fill:S_INK, 'font-family':'inherit', textLength:W-12,
      lengthAdjust:'spacingAndGlyphs' });
    fr.textContent=d[1];
    g.appendChild(en); g.appendChild(fr);
    /* TODAY SAYS SO IN A SHAPE, NOT IN A WORD. A blue dot under Monday is the only "you are
       here" a child who cannot read can use. */
    if(today) g.appendChild(mk("circle",{ cx:x+W/2, cy:Y+H-18, r:6, fill:S_BLUE }));
    g.onclick=()=>{
      stop();
      sayDay(d[0],d[1]);
      if(!today) return;
      if(evening && !CAL.crossed){
        CAL.crossed=true;
        const c=mk('path',{ d:'M'+(x+10)+' '+(Y+12)+' L'+(x+W-10)+' '+(Y+H-12)+
                              ' M'+(x+W-10)+' '+(Y+12)+' L'+(x+10)+' '+(Y+H-12),
          stroke:S_RED, 'stroke-width':7, 'stroke-linecap':'round', fill:'none' });
        /* It DRAWS itself rather than appearing, because she is the one crossing the day off and
           a line that arrives instantly does not feel like something she did. */
        c.style.strokeDasharray='300'; c.style.strokeDashoffset='300';
        c.style.transition='stroke-dashoffset .45s ease-out';
        s.appendChild(c); requestAnimationFrame(()=>{ c.style.strokeDashoffset='0'; });
      } else if(!evening && !CAL.marked){
        CAL.marked=true;
        s.appendChild(mk('circle',{ cx:x+W+7, cy:Y+14, r:6, fill:S_GREEN }));
      }
    };
    s.appendChild(g);
  });
  /* A CROSS ALREADY MADE STAYS MADE. Coming back to the screen redraws it without animating,
     so the page never shows her an empty Monday she has already crossed off. */
  if(CAL.crossed) s.appendChild(mk('path',{ d:'M'+(X0+10)+' '+(Y+12)+' L'+(X0+W-10)+' '+(Y+H-12)+
      ' M'+(X0+W-10)+' '+(Y+12)+' L'+(X0+10)+' '+(Y+H-12),
    stroke:S_RED, 'stroke-width':7, 'stroke-linecap':'round', fill:'none' }));
  if(CAL.marked) s.appendChild(mk('circle',{ cx:X0+W+7, cy:Y+14, r:6, fill:S_GREEN }));
  return s;
}
SCENES.calendrier=()=>calendarScene(false);
SCENES['calendrier-soir']=()=>calendarScene(true);
function artEl(l){
  if(!l||!l.art) return null;
  const d=document.createElement('div'); d.className='art';
  /* A SCENE IS DRAWN, NOT FETCHED. It has its intrinsic size immediately, so the pagination
     measurement that an <img> defeats is not a problem here — see the note on .art using HEIGHT
     rather than max-height. */
  if(l.art.scene && SCENES[l.art.scene]){ d.appendChild(SCENES[l.art.scene]()); return d; }
  const i=document.createElement('img'); i.src=l.art.src; i.alt=l.art.alt||'';
  d.appendChild(i); return d;
}
function show(i){
  stop();
  at=Math.max(0,Math.min(screens.length-1,i));
  pageEl.innerHTML='';
  const a=artEl(screens[at][0]); if(a) pageEl.appendChild(a);
  for(const l of screens[at]) pageEl.appendChild(lineEl(l));
  document.getElementById('pos').textContent=(at+1)+' / '+screens.length;
  document.getElementById('back').disabled=(at===0);
  document.getElementById('next').disabled=(at===screens.length-1);
  readScreen();
}
/* The chapter reads itself, line by line, in her order. She can tap any word at any moment and
   it says itself; she can tap a line and it reads again. Nothing loops and nothing sticks. */
let reading=0;
async function readScreen(){
  const mine=++reading;
  for(const p of [...pageEl.children]){
    if(mine!==reading) return;
    if(!p._line) continue;          /* the picture is not a line and has nothing to say */
    await sayLine(p);
  }
}
document.getElementById('next').onclick=()=>show(at+1);
document.getElementById('back').onclick=()=>show(at-1);
document.getElementById('again').onclick=()=>readScreen();
let rz=0; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(paginate,200); });
paginate();
</script>
</body>
